name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  # Backend Tests
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/test-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt
        cd ../tests
        pip install -r test-requirements.txt
        
    - name: Run backend tests
      run: |
        cd tests
        python -m pytest backend/ -v --cov=../backend --cov-report=xml --cov-report=html
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./tests/coverage.xml
        flags: backend
        name: backend-coverage
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results-${{ matrix.python-version }}
        path: |
          tests/htmlcov/
          tests/pytest_report.html

  # Frontend Tests
  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Install Python for tests
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install test dependencies
      run: |
        cd tests
        pip install -r test-requirements.txt
        
    - name: Run frontend tests
      run: |
        cd tests
        python -m pytest frontend/ -v
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build-${{ matrix.node-version }}
        path: frontend/dist/

  # Integration Tests
  test-integration:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        # Backend dependencies
        cd backend
        pip install -r requirements.txt
        cd ..
        
        # Frontend dependencies
        cd frontend
        npm ci
        cd ..
        
        # Test dependencies
        cd tests
        pip install -r test-requirements.txt
        cd ..
        
    - name: Start backend server
      run: |
        cd backend
        python main.py &
        echo $! > backend.pid
        cd ..
        
        # Wait for backend to start
        for i in {1..30}; do
          if curl -s http://localhost:8000/health; then
            echo "Backend started successfully"
            break
          fi
          sleep 1
        done
        
    - name: Run integration tests
      run: |
        cd tests
        python -m pytest integration/ -v --tb=short
        
    - name: Stop backend server
      if: always()
      run: |
        if [ -f backend/backend.pid ]; then
          kill $(cat backend/backend.pid) || true
        fi

  # E2E Tests
  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-integration]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Playwright
      run: |
        cd tests
        pip install -r test-requirements.txt
        python -m playwright install chromium
        
    - name: Install dependencies
      run: |
        # Backend dependencies
        cd backend
        pip install -r requirements.txt
        cd ..
        
        # Frontend dependencies
        cd frontend
        npm ci
        cd ..
        
    - name: Start services
      run: |
        # Start backend
        cd backend
        python main.py &
        echo $! > backend.pid
        cd ..
        
        # Start frontend dev server
        cd frontend
        npm run dev &
        echo $! > frontend.pid
        cd ..
        
        # Wait for services to start
        for i in {1..30}; do
          if curl -s http://localhost:8000/health && curl -s http://localhost:5173; then
            echo "Services started successfully"
            break
          fi
          sleep 1
        done
        
    - name: Run E2E tests
      run: |
        cd tests
        python -m pytest e2e/ -v --tb=short
        
    - name: Stop services
      if: always()
      run: |
        if [ -f backend/backend.pid ]; then
          kill $(cat backend/backend.pid) || true
        fi
        if [ -f frontend/frontend.pid ]; then
          kill $(cat frontend/frontend.pid) || true
        fi
        
    - name: Upload E2E artifacts
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: e2e-screenshots
        path: tests/screenshots/

  # Deployment Tests
  test-deployment:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install test dependencies
      run: |
        cd tests
        pip install -r test-requirements.txt
        
    - name: Run deployment tests
      run: |
        cd tests
        python -m pytest deployment/ -v -m deployment
        
    - name: Test production endpoints
      run: |
        # Test production API
        curl -f https://razorflow-ai-production.up.railway.app/health || exit 1
        curl -f https://razorflow-ai-production.up.railway.app/ || exit 1
        
        # Test production frontend
        curl -f https://razor303jc.github.io/RazorFlow-AI-v2/ || exit 1

  # Security Tests
  test-security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install security tools
      run: |
        pip install bandit safety semgrep
        
    - name: Run Bandit security scan
      run: |
        bandit -r backend/ -f json -o bandit-report.json
        bandit -r backend/ || true
        
    - name: Run Safety vulnerability check
      run: |
        cd backend
        safety check --json --output ../safety-report.json || true
        safety check || true
        
    - name: Run Semgrep security scan
      run: |
        semgrep --config=auto backend/ || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  # Performance Tests
  test-performance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        cd ../tests
        pip install -r test-requirements.txt
        pip install locust
        
    - name: Start backend server
      run: |
        cd backend
        python main.py &
        echo $! > backend.pid
        cd ..
        
        # Wait for backend to start
        for i in {1..30}; do
          if curl -s http://localhost:8000/health; then
            echo "Backend started successfully"
            break
          fi
          sleep 1
        done
        
    - name: Run performance tests
      run: |
        cd tests
        python -m pytest -v -m performance
        
    - name: Stop backend server
      if: always()
      run: |
        if [ -f backend/backend.pid ]; then
          kill $(cat backend/backend.pid) || true
        fi

  # Test Summary
  test-summary:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-integration, test-e2e]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Generate test summary
      run: |
        echo "# Test Summary" > test-summary.md
        echo "" >> test-summary.md
        echo "## Test Results" >> test-summary.md
        echo "" >> test-summary.md
        
        # Check job statuses
        echo "- Backend Tests: ${{ needs.test-backend.result }}" >> test-summary.md
        echo "- Frontend Tests: ${{ needs.test-frontend.result }}" >> test-summary.md
        echo "- Integration Tests: ${{ needs.test-integration.result }}" >> test-summary.md
        echo "- E2E Tests: ${{ needs.test-e2e.result }}" >> test-summary.md
        
        echo "" >> test-summary.md
        echo "## Artifacts" >> test-summary.md
        echo "" >> test-summary.md
        
        # List available artifacts
        find . -name "*.html" -o -name "*.xml" -o -name "*.json" | head -20 >> test-summary.md
        
    - name: Upload test summary
      uses: actions/upload-artifact@v3
      with:
        name: test-summary
        path: test-summary.md

  # Notification
  notify:
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
    - name: Notify on success
      if: needs.test-summary.result == 'success'
      run: |
        echo "✅ All tests passed successfully!"
        
    - name: Notify on failure
      if: needs.test-summary.result != 'success'
      run: |
        echo "❌ Some tests failed. Check the logs for details."
        exit 1
